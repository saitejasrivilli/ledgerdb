name: MinIO integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  minio-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # Run MinIO directly via `docker run` instead of GitHub Actions'
      # `services:` block — `services:` can't override a container's
      # command/args, and the official minio/minio image needs
      # `server /data` passed explicitly or it just prints help and
      # exits. Running it ourselves gives full control over that.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address :9001

      - name: Wait for MinIO to be reachable
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO never became reachable"
          docker logs minio || true
          exit 1

      - name: Run real MinIO integration test
        env:
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: go test ./tests/integration/... -v -run TestRealMinIO

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true
